---
# tasks file for roles/common
- name: Install base packages
  ansible.builtin.dnf:
    name: "{{ common_packages }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Enable and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Wait until firewall is started
  ansible.builtin.command:
    cmd : firewall-cmd --state
  register: common_firewall_state
  until: common_firewall_state.rc == 0
  retries: 10
  delay: 3
  changed_when: false

- name: Allow SSH through the firewall
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    state: enabled
    immediate: yes

- name: Check that the list of admin SSH keys is not empty
  ansible.builtin.assert:
    that:
      - common_admin_keys | length > 0
    fail_msg: "The list of admin SSH keys is empty. Please add at least one key in playbooks/group_vars/all/admin_keys.yml."
    quiet: true

- name: Allow only the team's SSH keys for the admin user
  ansible.posix.authorized_key:
    user: "{{ common_admin_user }}"
    key: "{{ common_admin_keys | map(attribute='key') | join('\n') }}"
    exclusive: true
    state: present
