docker_packages:
  - dnf-plugins-core
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  
# Since RHEL 10
docker_kernel_modules:
  - xt_addrtype
  - br_netfilter
  