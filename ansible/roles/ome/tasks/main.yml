---
- name: Check that the environment and its secrets are defined
  ansible.builtin.assert:
    that:
      - ome_env in ome_branch_map
      - vault_ome_nntp_user_password is defined
      - vault_ome_nntp_debug_password is defined
    fail_msg: >-
      Set ome_env in inventories/<env>/group_vars/all/vars.yml and create the
      encrypted vault.yml for this environment (see docs/runbook.md).
    quiet: true

- name: Create the application directory
  ansible.builtin.file:
    path: "{{ ome_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check out the fork on the branch of this environment
  # Needed to build the NNTP image on the server.
  ansible.builtin.git:
    repo: "{{ ome_repo_url }}"
    dest: "{{ ome_src_dir }}"
    version: "{{ ome_branch }}"
    force: false
  register: ome_src

- name: Build the NNTP peers from the other nodes in the inventory
  ansible.builtin.set_fact:
    ome_nntp_peers: "{{ ome_nntp_peers + [ome_peer] }}"
  vars:
    ome_peer:
      name: "{{ hostvars[item]['ome_hostname'] | default(item) }}"
      dns_name: "{{ hostvars[item]['ansible_host'] }}"
      port: "{{ ome_nntp_port }}"
      incoming_ip: "{{ hostvars[item]['ansible_host'] }}"
  loop: "{{ groups['ome_nodes'] | difference([inventory_hostname]) }}"

- name: Render config.json (mounted as the ome_config secret)
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ ome_src_dir }}/config.json"
    owner: root
    group: root
    mode: "0600"
  register: ome_nntp_config

- name: Remove the old API environment file
  # Remove the unused API.env file; the API reads config.json
  ansible.builtin.file:
    path: "{{ ome_base_dir }}/api.env"
    state: absent

- name: Render the compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ ome_base_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  register: ome_compose

- name: Allow the frontend port through the firewall
  # Docker publishes ports itself (bypassing firewalld); this rule documents
  # the intent and keeps the port open if Docker's behaviour changes.
  ansible.posix.firewalld:
    port: "{{ ome_frontend_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled

- name: Write the nftables table that limits NNTP to the peers
  ansible.builtin.template:
    src: ome-nntp-peers.nft.j2
    dest: /etc/nftables/ome-nntp-peers.nft
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  notify: Load the NNTP peer filter

- name: Install the service that loads the NNTP peer filter at boot
  ansible.builtin.template:
    src: ome-nntp-firewall.service.j2
    dest: /etc/systemd/system/ome-nntp-firewall.service
    owner: root
    group: root
    mode: "0644"

- name: Create the folder for Docker service drop-ins
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Make Docker require the NNTP peer filter
  ansible.builtin.template:
    src: docker-req-ome-nntp-firewall.conf.j2
    dest: /etc/systemd/system/docker.service.d/ome-nntp-firewall.conf
    owner: root
    group: root
    mode: "0644"

- name: Enable and start the NNTP peer filter
  ansible.builtin.systemd:
    name: ome-nntp-firewall
    enabled: true
    state: started
    daemon_reload: true
    
- name: Apply the firewall changes before NNTP is published
  ansible.builtin.meta: flush_handlers

- name: Start the OME stack
  community.docker.docker_compose_v2:
    project_src: "{{ ome_base_dir }}"
    files:
      - compose.yml
    state: present
    # Build the NNTP image only when the fork checkout changed
    # (always on a new server: the first checkout counts as a change).
    build: "{{ 'always' if ome_src.changed else 'never' }}"
    # Each service's pull_policy decides: NNTP is built here, API and
    # frontend are pulled when missing. Watchtower handles later updates.
    pull: policy
    # API and NNTP read config.json only at start (recreate them when changed)
    recreate: "{{ 'always' if (ome_nntp_config.changed) else 'auto' }}"
    remove_orphans: true
  register: ome_stack

- name: Recreate the NNTP container when its image was rebuilt
  # Compose does not recreate a container when only the image behind its tag
  # changed, so NNTP would keep running the old code. NNTP has no volume yet,
  # so this also deletes the articles on this node (volumes: next sprint).
  community.docker.docker_compose_v2:
    project_src: "{{ ome_base_dir }}"
    files:
      - compose.yml
    services:
      - nntp-server
    dependencies: false
    build: never
    pull: never
    recreate: always
    state: present
  when: ome_src.changed

- name: Pre-seed newsgroups from the configured peers
  # Same as upstream's post_start hook. Only useful when peers are set.
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ ome_base_dir }}/compose.yml exec -T nntp-server
      sh -c "/usr/local/bin/wait_for_tcp.sh 119 20 && /usr/local/bin/preseed.sh"
  when:
    - ome_nntp_peers | length > 0
    - ome_src.changed or ome_nntp_config.changed
  register: ome_preseed
  changed_when: ome_preseed.rc == 0
  failed_when: false

- name: Wait until the frontend answers
  ansible.builtin.uri:
    url: "http://localhost:{{ ome_frontend_port }}/imls/"
    status_code: 200
  register: ome_frontend_check
  until: ome_frontend_check.status == 200
  retries: 12
  delay: 5

- name: Wait until nginx can reach the API
  # 502/504 means nginx cannot reach FastAPI. Any other answer means the
  # request arrived at FastAPI (a 404 for /api/ itself is fine).
  ansible.builtin.uri:
    url: "http://localhost:{{ ome_frontend_port }}/api/"
    status_code: [200, 307, 404, 405, 422]
  register: ome_api_check
  until: ome_api_check.status not in [502, 503, 504, -1]
  retries: 12
  delay: 5
