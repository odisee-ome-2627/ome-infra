---
# tasks file for monitoring
- name: Create monitoring base directory
  ansible.builtin.file:
    path: "{{ monitoring_base_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Render the monitoring compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_base_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'

- name: Allow the Uptime Kuma port trough the firewall
  ansible.posix.firewalld:
    port: "{{ monitoring_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled

- name: Start Uptime Kuma
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_base_dir }}"
    files:
      - docker-compose.yml
    state: present
    pull: missing
    remove_orphans: true
    
- name: Wait until Uptime Kuma answers
  ansible.builtin.uri:
    url: "http://localhost:{{ monitoring_port }}/"
    status_code: [200, 302]
    follow_redirects: none
  register: monitoring_check
  until: monitoring_check.status in [200, 302]
  retries: 12
  delay: 5